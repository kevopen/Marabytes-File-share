appId: com.marabytes.fileshare
productName: MaraBytes File Share
directories:
  output: release
icon: build/icon.png
publish:
  provider: github
  owner: kevopen
  repo: Electron-File-share
linux:
  target:
    - AppImage
    - deb
  category: Utility
win:
  target:
    - nsis
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "MaraBytes File Share"
