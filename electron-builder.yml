appId: com.marabytes.fileshare
productName: MaraBytes File Share
directories:
  output: release
files:
  - out/**/*
  - "!node_modules/**/*"
icon: build/icon.png
linux:
  target:
    - AppImage
    - deb
  category: Utility
win:
  target:
    - portable
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
