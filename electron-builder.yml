appId: com.marabytes.fileshare
productName: MaraBytes File Share
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - "!node_modules/**/*"
linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
