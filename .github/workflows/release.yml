name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package:linux
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MaraBytes File Share ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## MaraBytes File Share ${{ github.ref_name }}

            ### Downloads
            - **Windows** — `MaraBytes File Share-*-win-x64.exe` (portable)
            - **Linux** — `MaraBytes File Share-*.AppImage` (just run it)
            - **Linux (Debian/Ubuntu)** — `marabytes-file-share_*_amd64.deb`
          files: |
            release/MaraBytes File Share-*.AppImage
            release/marabytes-file-share_*.deb

  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release upload ${{ github.ref_name }} release/MaraBytes\ File\ Share-*.exe --clobber
